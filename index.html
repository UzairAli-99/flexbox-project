<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>

      body {
        font-family: "Sono", sans-serif;
      }

      @media (min-width: 1024px) {

        body{
          background-color: aquamarine;
        }

        .pricing-container{
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-content: center;
          height: 100vh;
        }

        .pricing-plan{
          background-color: #f2f2f2;
          flex-basis: 400px;
          text-align: center;
          padding-top: 40px;
          padding-bottom: 40px;
          padding-left: 20px;
          padding-right: 20px;
          margin: 20px;
          border-radius: 30px;
        }

        .plan-features{
          list-style: none;
          text-align: left;
          line-height: 30px;
        }

        .plan-title{
          font-size: 24px;
          font-weight: bold;
          margin-bottom: 10px;
        }

        .plan-price{
          font-size: 48px;
          font-weight: bold;
        }

        #list1{
          padding-left: 140px;
        }

        #list2{
          padding-left: 100px;
        }

        #list3{
          padding-left: 120px;
        }

        .plan-button{
          background-color: #ff6600;
          color: white;
          padding: 10px;
          border: none;
          border-radius: 5px;
        }

      }

      @media (min-width: 426px) and (max-width: 768px){

        body{
          background-color: aquamarine;
        }

        .pricing-container{
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          width: 100%;
          gap: 30px;
          margin-top: 30px;
          margin-bottom: 30px;
        }

        .pricing-plan{
          background-color: #f2f2f2;
          width: 300px;
          flex-basis: 200px;
          text-align: center;
          padding-top: 30px;
          padding-bottom: 30px;
          padding-left: 20px;
          padding-right: 20px;
          border-radius: 30px;
        }

        .plan-title{
          font-size: 24px;
          font-weight: bold;
          margin-bottom: 10px;
        }

        .plan-price{
          font-size: 35px;
          font-weight: bold;
        }

        .plan-features{
          list-style: none;
          text-align: left;
          line-height: 30px;
        }

        #list1{
          padding-left: 90px;
        }

        #list2{
          padding-right: 10px;
        }

        #list3{
          padding-left: 70px;
        }

        .plan-button{
          background-color: #ff6600;
          color: white;
          border: none;
          border-radius: 5px;
          padding: 10px;
        }

      }

    @media (min-width: 320px) and (max-width: 425px){

      body{
        background-color: aquamarine;
      }

      .pricing-container{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        gap: 30px;
        margin-top: 30px;
        margin-bottom: 30px;
      }

      .pricing-plan{
        background-color: #f2f2f2;
        width: 300px;
        height: 200px;
        text-align: center;
        padding-top: 30px;
        padding-bottom: 60px; 
        padding-left: 10px;
        padding-right: 10px;    
        border-radius: 20px; 
      }

      .plan-features{
        list-style: none;
        text-align: left;
        line-height: 30px;
      }

      .plan-title{
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .plan-price{
        font-size: 30px;
        font-weight: bold;
      }

      #list1{
        padding-left: 80px;
      }

      #list2{
        padding-right: 20px;
      }

      #list3{
        padding-left: 70px;
      }

      .plan-button{
        color: white;
        background-color: #ff6600;
        border: none;
        padding: 10px;
        border-radius: 5px;
      }


    }

    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$11.99/month</div>
        <ul class="plan-features" id="list1">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features" id="list2">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features" id="list3">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
